services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ubp
    ports:
      - "5433:5432"
    volumes:
      - ubp_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ubp_redis_data:/data

volumes:
  ubp_postgres_data:
  ubp_redis_data:
